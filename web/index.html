<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conexão Escola-Família</title>
<style>
  :root { --tinta:#1f2328; --suave:#5f6368; --linha:#d9d9d9; --fundo:#fafaf7; --cartao:#fff;
          --baixo:#2e7d32; --medio:#b26a00; --alto:#c62828; --azul:#1f5fbf; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; color:var(--tinta); background:var(--fundo); }
  header { padding:16px 20px; border-bottom:1px solid var(--linha); background:var(--cartao); }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:var(--suave); font-size:14px; }
  nav { display:flex; gap:8px; padding:12px 20px; }
  nav button { padding:8px 14px; border:1px solid var(--linha); background:var(--cartao); border-radius:6px; cursor:pointer; }
  nav button.ativo { border-color:var(--azul); color:var(--azul); font-weight:600; }
  main { max-width:1140px; margin:0 auto; padding:0 20px 40px; }
  #professor { max-width:860px; margin:0 auto; }
  .grade-coord { display:grid; grid-template-columns:250px minmax(0, 1fr); gap:16px; align-items:start; }
  .caixa { position:sticky; top:12px; }
  .caso { padding:10px 8px; border-top:1px solid var(--linha); cursor:pointer; font-size:14px; }
  .caso:first-of-type { border-top:0; } .caso:hover, .caso.ativo { background:#f4f6fb; }
  .pendente { display:inline-block; min-width:20px; padding:0 6px; border-radius:10px; background:var(--medio);
              color:#fff; font-size:12px; font-weight:600; text-align:center; }
  table.boletim { width:100%; border-collapse:collapse; font-size:13px; margin:8px 0; }
  .boletim th, .boletim td { padding:6px 8px; border-bottom:1px solid var(--linha); text-align:center; }
  .boletim th:first-child, .boletim td:first-child { text-align:left; }
  .boletim tfoot td { font-weight:600; }
  .boletim .aberto { background:#f4f6fb; font-style:italic; }
  .alerta { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:10px; background:#fdecea;
            color:var(--alto); font-size:12px; font-weight:600; }
  .chip { display:inline-block; margin:4px 4px 0 0; padding:1px 8px; border:1px solid var(--linha); border-radius:10px;
          font-size:12px; color:var(--suave); }
  .multiplos { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:10px; }
  .quadro { border:1px solid var(--linha); border-radius:8px; padding:8px 10px; font-size:13px; }
  .quadro.imediata { border-left:3px solid var(--alto); }
  button.acao.secundaria { background:var(--cartao); color:var(--azul); border:1px solid var(--azul); }
  .rolagem { overflow-x:auto; }
  .tempo { list-style:none; padding:0; margin:8px 0; border-left:2px solid var(--linha); }
  .tempo li { position:relative; padding:4px 0 10px 16px; font-size:14px; }
  .tempo li::before { content:""; position:absolute; left:-6px; top:9px; width:10px; height:10px; border-radius:50%;
                      background:var(--azul); border:2px solid var(--cartao); }
  .tempo li.chamada { cursor:pointer; } .tempo li.chamada:hover { background:#f4f6fb; }
  @media (max-width:760px) { .grade-coord { grid-template-columns:1fr; } .caixa { position:static; } }
  .cartao { background:var(--cartao); border:1px solid var(--linha); border-radius:10px; padding:16px; margin:12px 0; }
  label { display:block; font-size:14px; margin:10px 0 4px; }
  select, input, textarea { width:100%; padding:8px; border:1px solid var(--linha); border-radius:6px; font:inherit; }
  textarea { min-height:90px; }
  button.acao { margin-top:12px; padding:9px 16px; border:0; border-radius:6px; background:var(--azul); color:#fff; cursor:pointer; }
  .barra { height:10px; background:#eee; border-radius:5px; overflow:hidden; margin:8px 0; }
  .barra div { height:100%; }
  .baixo { color:var(--baixo); } .medio { color:var(--medio); } .alto { color:var(--alto); }
  ul { margin:6px 0; padding-left:20px; } .suave { color:var(--suave); font-size:14px; }
  .erro { color:var(--alto); font-size:14px; }
  .selo { display:inline-block; padding:2px 10px; border-radius:12px; font-size:13px; font-weight:600; }
  .selo.ativa { background:#e6f4ea; color:var(--baixo); } .selo.inativa { background:#fdecea; color:var(--alto); }
  .legenda { display:flex; gap:16px; font-size:13px; color:var(--suave); margin:8px 0 0; }
  .ficha { display:grid; grid-template-columns:2fr 1.4fr 1fr 1fr; gap:1px; background:var(--linha);
           border:1px solid var(--linha); border-radius:8px; overflow:hidden; margin:12px 0; }
  .ficha div { background:var(--cartao); padding:8px 10px; font-size:14px; }
  .ficha small { display:block; color:var(--suave); font-size:12px; }
  .nota { color:var(--suave); font-size:12px; margin:4px 0 12px; }
  .legenda i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
  :root { --aprov:#1f5fbf; --freq:#0f8a7e; --ficou:#8fa8d8; --evadiu:#e8833a; }
  .kpis { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:12px 0; }
  .kpi { background:var(--cartao); border:1px solid var(--linha); border-radius:10px; padding:12px 16px; }
  .kpi b { display:block; font-size:28px; } .kpi span { color:var(--suave); font-size:13px; }
  .linha { display:grid; grid-template-columns:70px 1fr auto; gap:12px; align-items:center;
           padding:10px 0; border-top:1px solid var(--linha); cursor:pointer; }
  .linha:first-child { border-top:0; } .linha:hover { background:#f4f6fb; }
  .nivel { text-align:center; padding:2px 0; border-radius:12px; font-size:12px; font-weight:600; color:#fff; }
  .nivel.baixo { background:var(--baixo); } .nivel.medio { background:var(--medio); } .nivel.alto { background:var(--alto); }
  pre { white-space:pre-wrap; font:inherit; }
  @media print { header, nav, .nao-imprime { display:none; } .cartao { border:0; } }
</style>
</head>
<body>
<header>
  <h1>Conexão Escola-Família</h1>
  <p>O modelo aponta. A conversa completa. Nenhum dado sai sem a coordenação.</p>
</header>
<nav>
  <button id="aba-professor" class="ativo" onclick="aba('professor')">Professor</button>
  <button id="aba-coordenacao" onclick="aba('coordenacao')">Coordenação</button>
  <a class="suave" href="/docs" style="margin-left:auto;align-self:center">API (/docs)</a>
</nav>
<main>
  <section id="professor">
    <div class="cartao">
      <div id="login-prof">
        <label for="professor-id">Professor(a)</label>
        <select id="professor-id"></select>
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password">
        <button class="acao" onclick="entrarProfessor()">Entrar</button>
      </div>
      <p id="prof-logado" hidden></p>
      <div id="painel-prof" hidden>
        <label for="turma">Turma</label>
        <select id="turma"></select>
        <label for="aluno">Aluno (nº de cadastro)</label>
        <select id="aluno"></select>
        <div id="painel-aluno"></div>
        <label for="acompanhamento">O que você tem observado</label>
        <textarea id="acompanhamento" placeholder="Ex.: chega cansado, faltou às duas últimas provas, isolado no intervalo..."></textarea>
        <label for="nome-completo">Seu nome completo (assina o envio)</label>
        <input id="nome-completo" autocomplete="off">
        <button class="acao" onclick="registrar()">Enviar à coordenação</button>
      </div>
      <p id="erro-professor" class="erro"></p>
    </div>
    <div id="resultado"></div>
  </section>

  <section id="coordenacao" hidden>
    <div class="cartao">
      <div id="login-coord">
        <label for="coord-id">Coordenação</label>
        <select id="coord-id"></select>
        <label for="coord-senha">Senha</label>
        <input id="coord-senha" type="password" autocomplete="current-password">
        <button class="acao" onclick="entrarCoordenacao()">Entrar</button>
      </div>
      <p id="coord-logada" hidden></p>
      <p id="erro-coord" class="erro"></p>
    </div>
    <div id="painel-coord" class="grade-coord" hidden>
      <aside class="cartao caixa"><p><strong>Caixa de casos</strong><br>
        <span class="suave">alunos com chamada de atenção</span></p>
        <div id="caixa"></div></aside>
      <div>
        <div id="kpis" class="kpis"></div>
        <div class="cartao"><p><strong>Fila de pendências</strong> <span class="suave">· por prioridade</span></p>
          <div id="fila"></div></div>
        <div class="cartao" id="painel-chaves"></div>
        <div id="detalhe"></div>
        <div id="documento"></div>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let alunos = [];
let medias = null;
let registros = [];
let chavesDoAluno = []; // o banco de chaves do aluno aberto no mapa // os relatos que a coordenação já carregou: alimentam a fila e a caixa de casos
let passe = null; // passe da coordenação: só na memória da página; fechou a aba, acabou.
let passeProfessor = null; // o do professor, separado: cada papel abre só a sua parte.

function aba(nome) {
  for (const n of ["professor", "coordenacao"]) {
    $(n).hidden = n !== nome;
    $("aba-" + n).classList.toggle("ativo", n === nome);
  }
  if (nome === "coordenacao" && passe) carregarFila();
}

async function api(caminho, opcoes = {}, chave = passe) {
  const headers = { "Content-Type": "application/json" };
  if (chave) headers.Authorization = `Bearer ${chave}`;
  const r = await fetch(caminho, { headers, ...opcoes });
  const corpo = await r.json();
  if (!r.ok) {
    const d = corpo.detail;
    throw new Error(Array.isArray(d) ? d.map((e) => e.msg).join("; ") : d);
  }
  return corpo;
}

async function carregarCadastros() {
  const coordenacao = await api("/v1/coordenacao");
  $("coord-id").innerHTML = coordenacao.map((c) => `<option value="${c.id}">${c.nome}</option>`).join("");
  const professores = await api("/v1/professores");
  $("professor-id").innerHTML = professores.map((p) => `<option value="${p.id}">${p.nome}</option>`).join("");
}

async function carregarAlunos(chave) {
  // O cadastro dos alunos só vem depois do login, com o passe de quem entrou.
  alunos = await api("/v1/alunos", {}, chave);
  const turmas = [...new Set(alunos.map((a) => a.turma))].sort();
  $("turma").innerHTML = turmas.map((t) => `<option>${t}</option>`).join("");
  $("turma").onchange = mostrarAlunosDaTurma;
  $("aluno").onchange = mostrarResumo;
  mostrarAlunosDaTurma();
}

function mostrarAlunosDaTurma() {
  // Ao trocar de turma, o primeiro aluno já vem selecionado.
  const daTurma = alunos.filter((a) => a.turma === $("turma").value);
  $("aluno").innerHTML = daTurma.map((a) => `<option value="${a.id}">${a.id} · ${a.nome}</option>`).join("");
  mostrarResumo();
}

function mostrarResumo() {
  // O professor vê a matrícula e o rendimento do semestre. A previsão fica com a coordenação.
  const a = alunos.find((x) => x.id === $("aluno").value);
  if (!a) return;
  $("painel-aluno").innerHTML = ficha(a) + grafico(a);
}

function ficha(a) {
  const m = a.matricula;
  return `<div class="ficha">
      <div><small>Nome completo</small>${a.nome}</div>
      <div><small>Matrícula</small>${a.id} · <span class="selo ${m.situacao}">${m.situacao}</span></div>
      <div><small>Turma</small>${a.turma}</div>
      <div><small>Idade</small>${a.dados.idade} anos</div>
    </div>${m.motivo ? `<p class="suave">Matrícula inativa: ${m.motivo}</p>` : ""}`;
}

function grafico(a) {
  // Barras agrupadas por semestre, numa escala só (0 a 100%): aprovação e frequência.
  const d = a.dados, f = a.frequencia;
  const pct = (aprov, insc) => (insc ? Math.round((aprov / insc) * 100) : 0);
  // A base UCI usa notas de 0 a 20 (Portugal); a tela mostra na escala brasileira, de 0 a 10.
  const nota = (v) => (v / 2).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const semestres = [
    { nome: "1º semestre", aprov: pct(d.disciplinas_1sem_aprovadas, d.disciplinas_1sem_inscritas),
      freq: f.sem1, media: d.media_1sem, texto: `${d.disciplinas_1sem_aprovadas}/${d.disciplinas_1sem_inscritas}` },
    { nome: "2º semestre", aprov: pct(d.disciplinas_2sem_aprovadas, d.disciplinas_2sem_inscritas),
      freq: f.sem2, media: d.media_2sem, texto: `${d.disciplinas_2sem_aprovadas}/${d.disciplinas_2sem_inscritas}` },
  ];
  const L = 480, A = 210, base = 170, topo = 20, alt = base - topo;
  const y = (v) => base - (v / 100) * alt;
  let svg = "";
  for (const v of [0, 50, 100]) {
    svg += `<line x1="40" x2="${L - 10}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/>
      <text x="34" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5f6368">${v}%</text>`;
  }
  semestres.forEach((s, i) => {
    const x0 = 80 + i * 200;
    const barras = [
      { v: s.aprov, cor: "var(--aprov)", dica: `Aprovação: ${s.texto} disciplinas (${s.aprov}%)` },
      { v: s.freq, cor: "var(--freq)", dica: `Frequência: ${s.freq}%` },
    ];
    barras.forEach((b, j) => {
      const x = x0 + j * 52;
      svg += `<g><title>${s.nome} · ${b.dica}</title>
        <rect x="${x}" y="${y(b.v)}" width="44" height="${base - y(b.v)}" rx="4" fill="${b.cor}"/>
        <text x="${x + 22}" y="${y(b.v) - 5}" text-anchor="middle" font-size="12" fill="#1f2328">${b.v}%</text></g>`;
    });
    svg += `<text x="${x0 + 48}" y="${base + 18}" text-anchor="middle" font-size="12" fill="#1f2328">${s.nome}</text>
      <text x="${x0 + 48}" y="${base + 34}" text-anchor="middle" font-size="11" fill="#5f6368">média ${nota(s.media)} de 10</text>`;
  });
  const fonte = f.fonte === "demo" ? "frequência de demonstração" : "frequência do diário de classe";
  return `<svg viewBox="0 0 ${L} ${A}" width="100%" style="max-width:480px" role="img"
      aria-label="Aprovação e frequência por semestre de ${a.nome}">${svg}</svg>
    <div class="legenda"><span><i style="background:var(--aprov)"></i>Aprovação nas disciplinas</span>
      <span><i style="background:var(--freq)"></i>Frequência</span><span>· ${fonte}</span></div>
    <p class="nota">Aprovação = disciplinas aprovadas ÷ inscritas. Média convertida de 0–20 para 0–10.</p>`;
}

function valorDoFator(fator, d) {
  // Nome legível e o valor do próprio aluno para cada coluna que o modelo usa.
  const sem = fator.includes("1sem") ? "1º" : "2º";
  const simNao = (v) => (v ? "sim" : "não");
  if (fator.startsWith("media_")) return [`Média do ${sem} semestre`, `${(d[fator] / 2).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} de 10`];
  if (fator.endsWith("_aprovadas")) return [`Aprovadas no ${sem} semestre`, `${d[fator]} de ${d[fator.replace("aprovadas", "inscritas")]}`];
  if (fator.endsWith("_inscritas")) return [`Disciplinas no ${sem} semestre`, `${d[fator]} inscritas`];
  return {
    idade: ["Idade", `${d.idade} anos`],
    nota_admissao: ["Nota de admissão", `${d.nota_admissao}`],
    disciplinas_2sem_sem_avaliacao: ["Sem avaliação no 2º semestre", `${d[fator]} disciplinas`],
    mensalidade_em_dia: ["Mensalidade", d.mensalidade_em_dia ? "em dia" : "atrasada"],
    devedor: ["Dívida com a escola", simNao(d.devedor)],
    bolsista: ["Bolsa de estudos", simNao(d.bolsista)],
    mora_longe_de_casa: ["Mora longe de casa", simNao(d.mora_longe_de_casa)],
    turno_diurno: ["Turno", d.turno_diurno ? "diurno" : "noturno"],
  }[fator] || [fator, ""];
}

function cartaoPredicao(p, a) {
  const cor = { baixo: "var(--baixo)", medio: "var(--medio)", alto: "var(--alto)" }[p.nivel];
  const pct = Math.round(p.risco_evasao * 100);
  // Modelo nenhum tem certeza: 100% e 0% aparecem como "mais de 99%" e "menos de 1%".
  const texto = pct >= 100 ? "mais de 99%" : pct <= 0 ? "menos de 1%" : `${pct}%`;
  const maior = Math.max(...p.fatores_do_dado.map((f) => f.peso), 1e-9);
  const fatores = p.fatores_do_dado.map((f) => {
    const [nome, valor] = valorDoFator(f.fator, a.dados);
    return `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:14px">
        <span>${nome}</span><strong>${valor}</strong></div>
      <div class="barra" style="height:6px;margin:4px 0"><div style="width:${Math.round((f.peso / maior) * 100)}%;background:${cor}"></div></div></div>`;
  }).join("");
  return `
    <p>Risco de evasão: <strong class="${p.nivel}">${texto} (${p.nivel})</strong></p>
    <div class="barra"><div style="width:${pct}%;background:${cor}"></div></div>
    <p><strong>O que mais pesou no cálculo</strong></p>
    ${fatores || `<p class="suave">Nenhum dado puxando o risco para cima.</p>`}
    <p><strong>Perguntas para a conversa</strong></p>
    <ul>${p.perguntas_para_conversa.map((q) => `<li>${q}</li>`).join("")}</ul>`;
}

async function entrarProfessor() {
  $("erro-professor").textContent = "";
  try {
    const r = await api("/v1/professores/login", { method: "POST", body: JSON.stringify({
      professor_id: $("professor-id").value, senha: $("senha").value }) }, null);
    passeProfessor = r.passe;
    $("senha").value = "";
    await carregarAlunos(passeProfessor);
    $("login-prof").hidden = true;
    $("prof-logado").hidden = false;
    $("prof-logado").innerHTML = `Entrou como <strong>${r.nome}</strong>
      <a href="#" onclick="sairProfessor(); return false" class="suave" style="margin-left:8px">sair</a>`;
    $("painel-prof").hidden = false;
  } catch (e) { $("erro-professor").textContent = e.message; }
}

function sairProfessor() {
  passeProfessor = null;
  $("login-prof").hidden = false;
  $("prof-logado").hidden = true;
  $("painel-prof").hidden = true;
  for (const id of ["painel-aluno", "resultado"]) $(id).innerHTML = "";
}

async function registrar() {
  $("erro-professor").textContent = "";
  try {
    const reg = await api("/v1/registros", { method: "POST", body: JSON.stringify({
      aluno_id: $("aluno").value, nome_completo: $("nome-completo").value,
      acompanhamento: $("acompanhamento").value }) }, passeProfessor);
    $("nome-completo").value = "";
    $("acompanhamento").value = "";
    $("resultado").innerHTML = `<div class="cartao"><p>${reg.mensagem} Registro nº ${reg.id}.</p></div>`;
  } catch (e) { $("erro-professor").textContent = e.message; }
}

async function entrarCoordenacao() {
  $("erro-coord").textContent = "";
  try {
    const r = await api("/v1/coordenacao/login", { method: "POST", body: JSON.stringify({
      coordenador_id: $("coord-id").value, senha: $("coord-senha").value }) });
    passe = r.passe;
    $("coord-senha").value = "";
    await carregarAlunos(passe);
    $("login-coord").hidden = true;
    $("coord-logada").hidden = false;
    $("coord-logada").innerHTML = `Entrou como <strong>${r.nome}</strong>
      <a href="#" onclick="sairCoordenacao(); return false" class="suave" style="margin-left:8px">sair</a>`;
    $("painel-coord").hidden = false;
    carregarFila();
  } catch (e) { $("erro-coord").textContent = e.message; }
}

function sairCoordenacao() {
  passe = null;
  $("login-coord").hidden = false;
  $("coord-logada").hidden = true;
  $("painel-coord").hidden = true;
  for (const id of ["detalhe", "documento"]) $(id).innerHTML = "";
}

async function carregarFila() {
  // Prioridade: primeiro o perigo iminente que o motor de chaves achou no relato; depois o risco do modelo,
  // do maior para o menor. Quem decide o que fazer é a coordenação.
  const todos = await api("/v1/registros");
  const fila = todos.filter((r) => r.status === "aguardando_coordenacao")
    .sort((x, y) => y.alerta - x.alerta || y.predicao.risco_evasao - x.predicao.risco_evasao);
  $("kpis").innerHTML = `
    <div class="kpi"><b>${fila.length}</b><span>pendências</span></div>
    <div class="kpi"><b class="alto">${fila.filter((r) => r.predicao.nivel === "alto").length}</b><span>prioridade alta</span></div>
    <div class="kpi"><b>${todos.length - fila.length}</b><span>encaminhados</span></div>`;
  $("fila").innerHTML = fila.length ? fila.map((r) => {
    const a = alunos.find((x) => x.id === r.aluno_id) || { nome: r.aluno_id, turma: "" };
    return `<div class="linha" onclick="abrir(${r.id})">
      <span class="nivel ${r.predicao.nivel}">${r.predicao.nivel}</span>
      <span><strong>${a.id} · ${a.nome}</strong> <span class="suave">· ${a.turma}</span>
        ${r.alerta ? `<span class="alerta">⚠ perigo iminente</span>` : ""}<br>
        <span class="suave">${r.professor} · ${r.criado_em.replace("T", " ")}</span>
        ${r.chaves.map((c) => `<span class="chip">${c}</span>`).join("")}</span>
      <span class="suave">abrir ›</span></div>`;
  }).join("") : `<p class="suave">Nenhum relatório aguardando a coordenação.</p>`;
  $("detalhe").innerHTML = "";
  registros = todos;
  mostrarCaixa();
  $("painel-chaves").innerHTML = painelDaEscola(await api("/v1/indicadores/chaves"));
}

function painelDaEscola(p) {
  // A vista da escola: cada chave num quadro pequeno, ocorrências por mês. Nenhum nome, nenhum relato.
  const com = p.chaves.filter((c) => c.total).sort((x, y) => (x.gravidade === "imediata" ? -1 : 0) - (y.gravidade === "imediata" ? -1 : 0) || y.total - x.total);
  const sem = p.chaves.filter((c) => !c.total).map((c) => c.nome);
  const maior = Math.max(1, ...com.flatMap((c) => c.por_mes));
  const quadro = (c) => {
    const L = 200, A = 64, base = 46, passo = L / p.meses.length;
    const barras = c.por_mes.map((n, i) => `<g><title>${p.meses[i]}: ${n} ocorrência${n === 1 ? "" : "s"}</title>
        <rect x="${i * passo}" y="0" width="${passo}" height="${A}" fill="transparent"/>
        ${n ? `<rect x="${i * passo + 3}" y="${base - (n / maior) * (base - 6)}" width="${passo - 6}" height="${(n / maior) * (base - 6)}"
          rx="2" fill="${c.gravidade === "imediata" ? "var(--alto)" : "var(--aprov)"}"/>` : ""}
        <text x="${i * passo + passo / 2}" y="${A - 4}" text-anchor="middle" font-size="9" fill="#5f6368">${p.meses[i][0]}</text></g>`).join("");
    return `<div class="quadro ${c.gravidade}"><div style="display:flex;justify-content:space-between">
        <strong>${c.nome}</strong><span>${c.total}</span></div>
      ${c.gravidade === "imediata" ? `<span class="suave">⚠ perigo iminente</span>` : ""}
      <svg viewBox="0 0 ${L} ${A}" width="100%" role="img" aria-label="${c.nome}: ocorrências por mês">${barras}</svg></div>`;
  };
  return `<p><strong>Chaves na escola</strong> <span class="suave">· ${p.ano_letivo}, ocorrências por mês letivo, sem nome de aluno</span></p>
    ${com.length ? `<div class="multiplos">${com.map(quadro).join("")}</div>` : `<p class="suave">Nenhuma chave registrada em ${p.ano_letivo}.</p>`}
    ${sem.length ? `<p class="nota">Sem ocorrência: ${sem.join(", ")}.</p>` : ""}`;
}

function mostrarCaixa(ativo) {
  // Um caso por aluno: quantas chamadas de atenção ele já teve e quantas ainda esperam a coordenação.
  const casos = {};
  for (const r of registros) {
    const c = casos[r.aluno_id] ||= { chamadas: 0, pendentes: 0, ultima: r.criado_em };
    c.chamadas += 1;
    if (r.status === "aguardando_coordenacao") c.pendentes += 1;
    if (r.criado_em > c.ultima) c.ultima = r.criado_em;
  }
  const ids = Object.keys(casos).sort((x, y) => casos[y].pendentes - casos[x].pendentes || x.localeCompare(y));
  $("caixa").innerHTML = ids.length ? ids.map((id) => {
    const a = alunos.find((x) => x.id === id) || { nome: id, turma: "" }, c = casos[id];
    return `<div class="caso ${id === ativo ? "ativo" : ""}" onclick="abrirAluno('${id}')">
      <div style="display:flex;justify-content:space-between;gap:8px"><strong>${a.nome}</strong>
        ${c.pendentes ? `<span class="pendente" title="aguardando a coordenação">${c.pendentes}</span>` : ""}</div>
      <span class="suave">${id} · ${a.turma} · ${c.chamadas} chamada${c.chamadas > 1 ? "s" : ""}</span></div>`;
  }).join("") : `<p class="suave">Nenhuma chamada de atenção registrada.</p>`;
}

async function abrirAluno(id) {
  // O mapa do aluno: a linha do tempo das chamadas, o boletim do ano e a média de cada bimestre.
  $("erro-coord").textContent = "";
  try {
    const a = alunos.find((x) => x.id === id);
    const b = await api(`/v1/alunos/${id}/boletim`);
    chavesDoAluno = await api(`/v1/alunos/${id}/chaves`);
    const trilha = await api(`/v1/alunos/${id}/acessos`);
    const chamadas = registros.filter((r) => r.aluno_id === id).sort((x, y) => x.criado_em.localeCompare(y.criado_em));
    const situacao = { aguardando_coordenacao: "aguardando a coordenação", aprovado: "aprovada pela coordenação" };
    $("documento").innerHTML = "";
    $("detalhe").innerHTML = `<div class="cartao">
      ${ficha(a)}
      <p><strong>Linha do tempo</strong> <span class="suave">· clique numa chamada para abrir o relato</span></p>
      <ul class="tempo">
        <li>Ano letivo de ${b.ano_letivo}${b.fechado ? "" : `, em andamento (atualizado em ${dataBR(b.atualizado_em)})`}:
          frequência de ${b.frequencia}%, ${b.disciplinas.filter((d) => ["abaixo da média", "em recuperação"].includes(d.situacao)).length}
          disciplina(s) abaixo da média</li>
        ${chamadas.map((r) => `<li class="chamada" onclick="abrir(${r.id})">${dataBR(r.criado_em)} · chamada de atenção
          de ${r.professor} <span class="suave">· ${situacao[r.status]}</span></li>`).join("")}
      </ul>
      ${graficoChaves(chavesDoAluno, b.ano_letivo)}
      <div id="chave-detalhe"></div>
      ${graficoMeses(b)}
      ${tabelaBoletim(b)}
      ${historico(trilha)}</div>`;
    mostrarCaixa(id);
    $("detalhe").scrollIntoView({ behavior: "smooth" });
  } catch (e) { $("erro-coord").textContent = e.message; }
}

function graficoChaves(chaves, ano) {
  // Uma faixa por chave, o ano letivo no eixo. Passe o mouse para ver o tema; clique para ver a situação.
  // Cheio = aberta; vazado = solucionada; cinza = descartada (o motor errou).
  if (!chaves.length) return `<p class="suave">O motor não achou nenhuma chave nos relatos deste aluno.</p>`;
  const meses = ["fev", "mar", "abr", "mai", "jun", "ago", "set", "out", "nov", "dez"];
  const numero = [2, 3, 4, 5, 6, 8, 9, 10, 11, 12];
  const faixas = [...new Set(chaves.map((c) => c.chave))]
    .sort((x, y) => (chaves.find((c) => c.chave === y).gravidade === "imediata") - (chaves.find((c) => c.chave === x).gravidade === "imediata"));
  const L = 560, m = 140, linha = 30, A = faixas.length * linha + 30;
  const x = (iso) => {
    const [aa, mm, dd] = iso.slice(0, 10).split("-").map(Number);
    let i = numero.indexOf(mm);
    if (i < 0) i = mm === 7 ? 4.99 : mm < 2 ? 0 : 9.99; // julho é férias; fora do ano letivo vai para a borda
    return m + ((aa < ano ? 0 : aa > ano ? 10 : i + (dd - 1) / 31) / 10) * (L - m - 10);
  };
  let svg = meses.map((mes, i) => `<text x="${m + ((i + 0.5) / 10) * (L - m - 10)}" y="${A - 8}" text-anchor="middle"
    font-size="11" fill="#5f6368">${mes}</text>`).join("");
  faixas.forEach((chave, k) => {
    const yy = 14 + k * linha, primeira = chaves.find((c) => c.chave === chave);
    svg += `<line x1="${m}" x2="${L - 10}" y1="${yy}" y2="${yy}" stroke="#eee"/>
      <text x="${m - 8}" y="${yy + 4}" text-anchor="end" font-size="12" fill="#1f2328">${primeira.nome}</text>`;
    for (const c of chaves.filter((c) => c.chave === chave)) {
      const cor = c.situacao === "descartada" ? "#9aa0a6" : c.gravidade === "imediata" ? "var(--alto)" : "var(--aprov)";
      const cheio = c.situacao === "aberta";
      svg += `<g style="cursor:pointer" onclick="mostrarChave(${c.id})"><title>${c.nome} · ${dataBR(c.em)} · ${c.situacao} · clique para ver</title>
        <circle cx="${x(c.em)}" cy="${yy}" r="12" fill="transparent"/>
        <circle cx="${x(c.em)}" cy="${yy}" r="6" fill="${cheio ? cor : "#fff"}" stroke="${cor}" stroke-width="2"/></g>`;
    }
  });
  return `<p><strong>Chaves dos relatos</strong> <span class="suave">· ${ano} · cheio = aberta, vazado = solucionada,
      cinza = descartada · clique num ponto</span></p>
    <svg viewBox="0 0 ${L} ${A}" width="100%" style="max-width:560px" role="img"
      aria-label="Chaves achadas nos relatos ao longo do ano">${svg}</svg>`;
}

function mostrarChave(id) {
  // A situação ocorrida: o trecho do relato que disparou a chave e se ela já foi solucionada.
  const c = chavesDoAluno.find((x) => x.id === id);
  const botoes = c.situacao === "aberta"
    ? `<button class="acao" onclick="mudarSituacao(${c.id}, 'solucionada')">Marcar como solucionada</button>
       <button class="acao secundaria" onclick="mudarSituacao(${c.id}, 'descartada')">Descartar (o motor errou)</button>`
    : `<button class="acao secundaria" onclick="mudarSituacao(${c.id}, 'aberta')">Reabrir</button>`;
  $("chave-detalhe").innerHTML = `<div class="cartao" style="background:#f8f9fb">
    <p><strong>${c.nome}</strong>${c.gravidade === "imediata" ? ` <span class="alerta">⚠ perigo iminente</span>` : ""}
      <span class="suave">· ${dataBR(c.em)} · relato de ${c.professor}</span></p>
    <p>“${c.trecho}”</p>
    <p class="suave">Situação: <strong>${c.situacao}</strong>${c.atualizado_por ? ` · por ${c.atualizado_por} em ${dataBR(c.atualizado_em)}` : ""}</p>
    ${botoes}
    <button class="acao secundaria" onclick="abrir(${c.registro_id})">Abrir o relato completo</button></div>`;
}

async function mudarSituacao(id, situacao) {
  $("erro-coord").textContent = "";
  try {
    const c = await api(`/v1/chaves/${id}/situacao`, { method: "POST", body: JSON.stringify({ situacao }) });
    await carregarFila();
    await abrirAluno(c.aluno_id);
    mostrarChave(id);
  } catch (e) { $("erro-coord").textContent = e.message; }
}

const dataBR = (iso) => iso.slice(0, 10).split("-").reverse().join("/");
const nota10 = (v) => (v == null ? "—" : v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }));

function graficoMeses(b) {
  // Uma série só: a média geral de cada mês, em dois blocos de semestre (julho é férias).
  // O mês em andamento aparece vazado; os meses que ainda não vieram ficam só no eixo.
  const L = 520, A = 210, m = 40, base = 160, topo = 16, passo = 36, folga = 24;
  const x = (i) => m + 22 + i * passo + (i >= 5 ? folga : 0), y = (v) => base - (v / 10) * (base - topo);
  let svg = "";
  for (const v of [0, 5, 10]) {
    svg += `<line x1="${m}" x2="${L - 10}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/>
      <text x="${m - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5f6368">${v}</text>`;
  }
  svg += `<line x1="${m}" x2="${L - 10}" y1="${y(b.media_aprovacao)}" y2="${y(b.media_aprovacao)}" stroke="#9aa0a6" stroke-dasharray="4 4"/>
    <text x="${L - 10}" y="${y(b.media_aprovacao) - 5}" text-anchor="end" font-size="11" fill="#5f6368">média ${nota10(b.media_aprovacao)}</text>`;
  for (const s of [[0, 5], [5, 10]]) {
    const pontos = b.medias_mes.slice(...s).map((v, k) => ({ v, i: s[0] + k })).filter((p) => p.v != null);
    if (pontos.length > 1) {
      svg += `<polyline fill="none" stroke="var(--aprov)" stroke-width="2"
        points="${pontos.map((p) => `${x(p.i)},${y(p.v)}`).join(" ")}"/>`;
    }
  }
  b.medias_mes.forEach((v, i) => {
    const aberto = i === b.mes_atual;
    svg += `<text x="${x(i)}" y="${base + 18}" text-anchor="middle" font-size="12"
      fill="${v == null && !aberto ? "#9aa0a6" : "#1f2328"}">${b.meses[i]}</text>`;
    if (v == null) return;
    svg += `<g><title>${b.meses[i]} · média geral ${nota10(v)}${aberto ? " · mês em andamento" : ""}</title>
      <circle cx="${x(i)}" cy="${y(v)}" r="14" fill="transparent"/>
      <circle cx="${x(i)}" cy="${y(v)}" r="5" fill="${aberto ? "#fff" : "var(--aprov)"}" stroke="${aberto ? "var(--aprov)" : "#fff"}" stroke-width="2"/></g>`;
  });
  const meio = (a, z) => (x(a) + x(z)) / 2;
  svg += `<text x="${meio(0, 4)}" y="${base + 36}" text-anchor="middle" font-size="11" fill="#5f6368">1º semestre</text>
    <text x="${meio(5, 9)}" y="${base + 36}" text-anchor="middle" font-size="11" fill="#5f6368">2º semestre</text>`;
  const vazio = b.medias_mes.some((v) => v != null) ? ""
    : `<text x="${L / 2}" y="${y(5)}" text-anchor="middle" font-size="13" fill="#5f6368">sem nota registrada no ano</text>`;
  return `<p><strong>Média geral por mês</strong> <span class="suave">· ${b.ano_letivo}, de 0 a 10${b.fechado ? "" : " · ponto vazado = mês em andamento"}</span></p>
    <svg viewBox="0 0 ${L} ${A}" width="100%" style="max-width:520px" role="img"
      aria-label="Média geral por mês em ${b.ano_letivo}">${svg}${vazio}</svg>`;
}

function tabelaBoletim(b) {
  // O boletim que os pais acompanham, mês a mês, em dois blocos de semestre. É também a tabela do gráfico acima.
  const cor = { aprovado: "baixo", "acima da média": "baixo", "em recuperação": "medio", "abaixo da média": "medio", "sem nota": "suave" };
  const celula = (v, i) => (i === b.mes_atual ? `<td class="aberto">${nota10(v)}</td>` : `<td>${nota10(v)}</td>`);
  const semestre = (n, de, ate) => {
    const meses = b.meses.slice(de, ate);
    const ultimo = n === 2;
    const titulo = `${n}º semestre <span class="suave">· ${meses[0]} a ${meses[meses.length - 1]}${
      ultimo && !b.fechado ? `, em andamento (atualizado em ${dataBR(b.atualizado_em)})` : ""}</span>`;
    const linhas = b.disciplinas.map((d) => `<tr><td>${d.disciplina}</td>
      ${d.notas.slice(de, ate).map((v, k) => celula(v, de + k)).join("")}
      <td><strong>${nota10(d.medias_semestre[n - 1])}</strong></td>
      <td>${d.faltas.slice(de, ate).reduce((s, f) => s + (f ?? 0), 0)}</td>
      ${ultimo ? `<td><strong>${nota10(d.media_ano)}</strong></td><td class="${cor[d.situacao]}">${d.situacao}</td>` : ""}</tr>`).join("");
    return `<p style="margin-top:16px"><strong>${titulo}</strong></p>
      <div class="rolagem"><table class="boletim">
        <thead><tr><th>Disciplina</th>${meses.map((mes, k) => `<th class="${de + k === b.mes_atual ? "aberto" : ""}">${mes}</th>`).join("")}
          <th>Média</th><th>Faltas</th>${ultimo ? `<th>Ano${b.fechado ? "" : " (parcial)"}</th><th>Situação</th>` : ""}</tr></thead>
        <tbody>${linhas}</tbody>
        <tfoot><tr><td>Média geral</td>${b.medias_mes.slice(de, ate).map((v, k) => celula(v, de + k)).join("")}
          <td>${nota10(b.medias_semestre[n - 1])}</td><td></td>${ultimo ? "<td></td><td></td>" : ""}</tr></tfoot>
      </table></div>`;
  };
  const fonte = b.fonte === "demo" ? "Boletim de demonstração, derivado das médias da base UCI." : "Boletim do diário de classe.";
  const baixa = b.frequencia < b.frequencia_minima;
  return `${semestre(1, 0, 5)}${semestre(2, 5, 10)}
    <p class="${baixa ? "alto" : ""}" style="font-size:14px">Frequência no ano até agora: <strong>${b.frequencia}%</strong>
      ${baixa ? `(abaixo do mínimo de ${b.frequencia_minima}%)` : ""}</p>
    <p class="nota">Média para aprovação: ${nota10(b.media_aprovacao)}. Frequência mínima: ${b.frequencia_minima}% (LDB, art. 24).
      ${b.fechado ? "" : "Aprovação e recuperação só saem quando o ano fecha; até lá, a situação mostra onde a disciplina está em relação à média. "}${fonte}</p>`;
}

async function dispersao(a) {
  // Cada ponto é um estudante da base; o aluno aberto aparece destacado no meio de todos.
  medias = medias || await api("/v1/indicadores/medias");
  const L = 360, A = 320, m = 40, lado = L - m - 12;
  const x = (v) => m + (v / 10) * lado, y = (v) => A - m - (v / 10) * lado;
  let svg = "";
  for (const v of [0, 5, 10]) {
    svg += `<line x1="${x(0)}" x2="${x(10)}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/>
      <text x="${m - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5f6368">${v}</text>
      <text x="${x(v)}" y="${A - m + 16}" text-anchor="middle" font-size="11" fill="#5f6368">${v}</text>`;
  }
  svg += `<line x1="${x(0)}" y1="${y(0)}" x2="${x(10)}" y2="${y(10)}" stroke="#9aa0a6" stroke-dasharray="4 4"/>`;
  for (const p of medias.pontos) {
    svg += `<circle cx="${x(p.m1)}" cy="${y(p.m2)}" r="2" fill="${p.evadiu ? "var(--evadiu)" : "var(--ficou)"}" opacity=".45"/>`;
  }
  const m1 = a.dados.media_1sem / 2, m2 = a.dados.media_2sem / 2;
  svg += `<g><title>${a.nome}: ${m1.toFixed(1)} → ${m2.toFixed(1)}</title>
    <circle cx="${x(m1)}" cy="${y(m2)}" r="7" fill="#1f2328" stroke="#fff" stroke-width="2"/></g>
    <text x="${x(m1) + 10}" y="${y(m2) - 8}" font-size="12" font-weight="600" fill="#1f2328">${a.nome.split(" ")[0]}</text>
    <text x="${x(0) + 6}" y="${y(10) + 14}" font-size="12" fill="#1f2328">r = ${medias.r.toLocaleString("pt-BR")}</text>
    <text x="${x(5)}" y="${A - 6}" text-anchor="middle" font-size="11" fill="#5f6368">média do 1º semestre</text>
    <text transform="translate(12 ${y(5)}) rotate(-90)" text-anchor="middle" font-size="11" fill="#5f6368">média do 2º semestre</text>`;
  return `<p><strong>Onde ele está entre ${medias.n.toLocaleString("pt-BR")} estudantes</strong>
      <span class="suave">· acima da diagonal melhorou, abaixo piorou</span></p>
    <svg viewBox="0 0 ${L} ${A}" width="100%" style="max-width:360px" role="img"
      aria-label="Dispersão das médias do 1º e do 2º semestre, com ${a.nome} destacado">${svg}</svg>
    <div class="legenda"><span><i style="background:var(--ficou)"></i>continuou</span>
      <span><i style="background:var(--evadiu)"></i>evadiu</span></div>
    <p class="nota">Cada ponto é um estudante da base UCI (ensino superior, Portugal). Média 0 = sem nota registrada
      no semestre. r = correlação de Pearson.</p>`;
}

async function abrir(id) {
  // O relatório do professor puxa o resto: matrícula, rendimento e a previsão do modelo.
  // Cada abertura vai para a trilha de auditoria, no nome de quem fez o login.
  const r = await api(`/v1/registros/${id}`);
  const a = alunos.find((x) => x.id === r.aluno_id);
  const trilha = await api(`/v1/alunos/${a.id}/acessos`);
  $("documento").innerHTML = "";
  $("detalhe").innerHTML = `<div class="cartao">
    ${ficha(a)}
    ${grafico(a)}
    ${await dispersao(a)}
    <p><strong>Relatório do professor</strong> <span class="suave">· ${r.professor}, ${r.criado_em.replace("T", " ")}</span></p>
    <p>“${r.acompanhamento}”</p>
    ${r.chaves.length ? `<p class="suave">Chaves do relato: ${r.chaves.map((c) => `<span class="chip">${c}</span>`).join("")}
      ${r.alerta ? `<span class="alerta">⚠ perigo iminente</span>` : ""}</p>` : ""}
    ${cartaoPredicao(r.predicao, a)}
    <button class="acao" onclick="aprovar(${r.id})">Aprovar e gerar documento</button>
    ${historico(trilha)}</div>`;
  $("detalhe").scrollIntoView({ behavior: "smooth" });
}

function historico(trilha) {
  const nomes = { relatorio_enviado: "enviou o relatório", fila_vista: "viu na fila", ficha_aberta: "abriu a ficha",
                  historico_aberto: "abriu o histórico", boletim_aberto: "abriu o boletim",
                  chaves_vistas: "viu as chaves", chave_solucionada: "marcou uma chave como solucionada",
                  chave_descartada: "descartou uma chave", chave_aberta: "reabriu uma chave", aprovado: "aprovou", documento_gerado: "gerou o documento",
                  documento_impresso: "imprimiu o documento", envio_aberto: "abriu o e-mail para o responsável" };
  return `<p style="margin-top:20px"><strong>Histórico de acesso</strong>
      <span class="suave">· quem viu ou mexeu nos dados deste aluno (LGPD, art. 37)</span></p>
    <ul class="suave">${trilha.map((t) =>
      `<li>${t.em.replace("T", " ")} · ${t.quem} ${nomes[t.acao]}${t.registro_id ? ` (registro nº ${t.registro_id})` : ""}</li>`).join("")}</ul>`;
}

async function aprovar(id) {
  $("erro-coord").textContent = "";
  try {
    await api(`/v1/registros/${id}/aprovar`, { method: "POST" });
    $("documento").innerHTML = `<div class="cartao"><p><strong>O que vai para a família?</strong></p>
      <p class="suave">O relato do professor fica na ficha do aluno; não entra no documento.</p>
      <button class="acao" onclick="gerarDocumento(${id}, 'convite_boletim')">Convite e boletim</button>
      <button class="acao" onclick="gerarDocumento(${id}, 'convite')">Só o convite</button></div>`;
    carregarFila();
  } catch (e) { $("erro-coord").textContent = e.message; }
}

async function gerarDocumento(id, modelo) {
  $("erro-coord").textContent = "";
  try {
    const doc = await api(`/v1/registros/${id}/documento?modelo=${modelo}`);
    const mailto = `mailto:${doc.para}?subject=${encodeURIComponent(doc.assunto)}&body=${encodeURIComponent(doc.texto)}`;
    $("documento").innerHTML = `<div class="cartao"><p class="suave nao-imprime">Para: ${doc.para}</p>
      <pre>${doc.texto}</pre>
      <div class="nao-imprime"><button class="acao" onclick="saida(${id}, 'documento_impresso').then(() => window.print())">Imprimir</button>
      <a class="acao" style="display:inline-block;text-decoration:none" href="${mailto}"
        onclick="saida(${id}, 'envio_aberto')">Enviar ao responsável</a></div></div>`;
  } catch (e) { $("erro-coord").textContent = e.message; }
}

function saida(id, tipo) {
  // Imprimir e abrir o e-mail também vão para a trilha de auditoria.
  return api(`/v1/registros/${id}/saida`, { method: "POST", body: JSON.stringify({ tipo }) })
    .catch((e) => { $("erro-coord").textContent = e.message; });
}

carregarCadastros();
</script>
